<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback Form</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 680px; margin: 48px auto; padding: 0 20px; color: #202938; }
    h1 { color: #245a8d; }
    label { display: block; margin: 18px 0 6px; font-weight: 600; }
    input, select, textarea { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #aab5c1; border-radius: 4px; font: inherit; }
    textarea { min-height: 130px; resize: vertical; }
    button { margin-top: 20px; padding: 10px 20px; border: 0; border-radius: 4px; background: #245a8d; color: white; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Feedback Form</h1>
  <p>Please complete the fields below and submit your feedback.</p>
  <form action="submitFeedback" method="post" accept-charset="UTF-8">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" maxlength="100" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" maxlength="254" required>

    <label for="feedbackType">Feedback type</label>
    <select id="feedbackType" name="feedbackType" required>
      <option value="" selected disabled>Select a type</option>
      <option value="Complaint">Complaint</option>
      <option value="Suggestion">Suggestion</option>
      <option value="Compliment">Compliment</option>
    </select>

    <label for="comments">Comments</label>
    <textarea id="comments" name="comments" maxlength="2000" required></textarea>

    <button type="submit">Submit Feedback</button>
  </form>
</body>
</html>
